<div class="container">
    <div class="form-box">
        <h2>Shopping List</h2>

        <form class="add-item-form">
            <input type="text" name="item" placeholder="Add an item">
            <button type="submit">Add Item</button>
        </form>

        <table class="shopping-list-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Item</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Rice</td>
                    <td><input type="checkbox"/></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Wheat</td>
                    <td><input type="checkbox"/></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
