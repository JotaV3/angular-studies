<div class="container">
    <div class="form-box">
        <h2>Shopping List</h2>

        <form class="add-item-form" (ngSubmit)="addItem()" #form="ngForm">
            <input type="text" name="item" placeholder="Add an item" [(ngModel)] = "item">
            <button type="submit">Add Item</button>
        </form>

        <table class="shopping-list-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Item</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                @for(item of itemList; track item.id) {
                    <tr>
                        <td>{{ item.id }}</td>
                        <td><span [ngClass]="{'item-purchased': item.isPurchased}">{{ item.name }}</span></td>
                        <td><input type="checkbox" [checked] = "item.isPurchased" (change)="togglePurchased(item)"/></td>
                    </tr>
                } @empty {
                    <tr>
                        <td colspan="3">No items in the list.</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
